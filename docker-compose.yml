services:
  postgres:
    image: postgres:16-alpine
    container_name: p043_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: p043_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: p043_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p043_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/p043_db
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-""}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-""}
      GROQ_API_KEY: ${GROQ_API_KEY:-""}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-""}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LANGCHAIN_TRACING_V2: "false"
      # Active LLM Provider (openrouter | groq | gemini | openai)
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      MODEL_NAME: ${MODEL_NAME:-meta-llama/llama-3.3-70b-instruct}
      # For Gemini fallback: LLM_PROVIDER="gemini", MODEL_NAME="gemini-2.5-flash"
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-"models/gemini-embedding-2"}
      APP_ENV: production
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8000,http://127.0.0.1:3000,http://127.0.0.1:5173"
      # Vector Store Config
      VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE:-"qdrant"}
      QDRANT_URL: ${QDRANT_URL:-""}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-""}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-"course_materials"}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-r2}
      S3_ENDPOINT: ${S3_ENDPOINT:-""}
      S3_BUCKET: ${S3_BUCKET:-""}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-""}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-""}
      S3_REGION: ${S3_REGION:-auto}
      S3_SECURE: "true"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: p043_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

