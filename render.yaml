services:
  # 1. Backend Web Service (Python FastAPI Docker)
  - type: web
    name: p043-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: p043-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: p043-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: p043-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  # 3. Redis Cache
  - type: redis
    name: p043-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  # 4. PostgreSQL Database
  - name: p043-postgres
    plan: free
    databaseName: p043_db
    user: p043_user
