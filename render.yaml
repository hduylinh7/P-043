services:
  # 1. Backend Web Service (Python FastAPI Docker)
  - type: web
    name: p043-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: p043-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: p043-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # --- LLM API Keys ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # --- Object Storage (Cloudflare R2 / S3 / MinIO) ---
      - key: STORAGE_PROVIDER
        value: r2
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_SECURE
        value: "true"
      # --- SMTP / Email (Nodemailer) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "true"
      # --- LangSmith (AI Logs / Tracing) ---
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: ai20k-agent
      - key: LANGCHAIN_TRACING_V2
        value: "true"

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: p043-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  # 3. Redis Cache
  - type: redis
    name: p043-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  # 4. PostgreSQL Database
  - name: p043-postgres
    plan: free
    databaseName: p043_db
    user: p043_user
